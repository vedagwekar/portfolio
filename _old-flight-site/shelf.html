<body>
  <main class="shelf-page">
    <section>
      <a class="shelf-more back" href="index.html#shelf-sec"><svg viewBox="0 0 36 16" width="36" height="16" aria-hidden="true"><path filter="url(#rough)" d="M34 8C25 6 15 9 4 7M11 2 3 7l7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> back</a>

  <script type="module">
